server {
    listen 443 ssl;
    server_name demos;
    ssl_certificate /certs/demos.crt;
    ssl_certificate_key /certs/demos.key;
    client_max_body_size 0;
    proxy_request_buffering off;
    resolver 127.0.0.11 valid=10s;
    set $api http://api:5585;
    set $rustfs http://rustfs:9000;

    location /demos { proxy_pass $api; proxy_set_header Host $host; }
    location /clips { proxy_pass $api; proxy_set_header Host $host; }
    # Presigned urls are signed for this host, so it goes through as it came.
    location /5stack { proxy_pass $rustfs; proxy_set_header Host $host; }
}
