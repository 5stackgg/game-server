name: Simulator e2e

# Every scenario in apps/simulator/e2e against the api's published image. The
# suite takes about 25 minutes, so it runs nightly and on PRs that change the
# simulator rather than on every PR; run only by hand, it once broke unnoticed
# for two weeks.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/simulator/**"
      - "shared/dotnet/**"
      - ".github/workflows/simulator-e2e.yaml"

concurrency:
  group: simulator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Play every scenario
        run: apps/simulator/e2e/run.sh --keep

      - name: The api's and the simulated servers' logs
        if: failure()
        working-directory: apps/simulator/e2e
        run: docker compose logs --no-color --tail 300 api sim-1 sim-2 sim-3

      - name: Stop the stack
        if: always()
        working-directory: apps/simulator/e2e
        run: docker compose down -v --remove-orphans
