name: Gamedata Validator Build

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream refs
        run: bash apps/gamedata-validator/scripts/resolve-refs.sh >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/gamedata-validator/Dockerfile
          push: true
          build-args: |
            CCS_GAMEDATA_REF=${{ env.CCS_GAMEDATA_REF }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gamedata-validator:${{ inputs.channel }}
            ghcr.io/${{ github.repository_owner }}/gamedata-validator:${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/gamedata-validator:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/gamedata-validator:buildcache,mode=max
