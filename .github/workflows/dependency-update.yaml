name: Check Dependency Releases

on:
  workflow_dispatch:
    inputs:
      swiftly_beta:
        description: "Move SwiftlyS2 to its newest beta; scheduled runs then follow its betas until that version's stable release ships"
        type: boolean
        default: false
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: dependency-update

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Each check stages its files only once every one of them is pinned, and
      # the next check starts by discarding whatever is left unstaged. A check
      # that fails halfway therefore ships nothing, while the others still go
      # out -- a runtime bumped without its nugets breaks the ABI.
      #
      # Upstream tags and URLs are spliced into sed scripts, where a `|` lets one
      # end the s command and GNU sed's `e` run a shell command with this job's
      # write token, so each has to match its expected shape before it is used.
      - name: SwiftlyS2
        env:
          SWIFTLY_BETA: ${{ inputs.swiftly_beta }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'SWIFTLYS2_VERSION="\K[^"]+' apps/swiftly/Dockerfile)
          RELEASES=$(gh api "repos/swiftly-solution/swiftlys2/releases?per_page=40")
          STABLE=$(jq -r '[.[] | select(.prerelease == false) | select(.tag_name | test("-beta") | not)] | .[0].tag_name // ""' <<<"$RELEASES")
          BETA=$(jq -r '[.[] | select(.tag_name | test("-beta"))] | .[0].tag_name // ""' <<<"$RELEASES")
          echo "current=$CURRENT stable=$STABLE beta=$BETA"

          for tag in "$CURRENT" "$STABLE" "$BETA"; do
            if [ -n "$tag" ] && [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)+(-beta\.[0-9]+)?$ ]]; then
              echo "::error::unexpected SwiftlyS2 tag: $tag"
              exit 1
            fi
          done

          # v1.5.0-beta.25 -> 1.5.0
          base() { local v="${1#v}"; echo "${v%%-*}"; }
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          newer_beta() {
            newer "$(base "$1")" "$(base "$2")" \
              || { [ "$(base "$1")" = "$(base "$2")" ] && [ "${1##*-beta.}" -gt "${2##*-beta.}" ]; }
          }

          # A beta pin follows newer betas until the stable release of its
          # version (or a later one) ships; picking only stables would walk it
          # back to the release before it and lose whatever it was pinned for.
          TARGET=""
          if [[ "$CURRENT" == *-beta* ]]; then
            if [ -n "$STABLE" ] && ! newer "$(base "$CURRENT")" "$(base "$STABLE")"; then
              TARGET="$STABLE"
            elif [ -n "$BETA" ] && newer_beta "$BETA" "$CURRENT"; then
              TARGET="$BETA"
            fi
          elif [ "$SWIFTLY_BETA" = "true" ]; then
            if [ -n "$BETA" ] && newer "$(base "$BETA")" "$(base "$CURRENT")"; then
              TARGET="$BETA"
            else
              echo "::notice::no SwiftlyS2 beta is ahead of $CURRENT"
            fi
          elif [ -n "$STABLE" ] && [ "$STABLE" != "$CURRENT" ]; then
            TARGET="$STABLE"
          fi
          if [ -z "$TARGET" ]; then
            exit 0
          fi
          NUGET_VERSION="${TARGET#v}"

          # NuGet and the release's zips trail the GitHub release by minutes;
          # pinning before they land bakes an image that fails to build
          ZIP="swiftlys2-linux-${TARGET}-with-runtimes.zip"
          if ! jq -e --arg tag "$TARGET" --arg zip "$ZIP" 'any(.[] | select(.tag_name == $tag) | .assets[]; .name == $zip)' <<<"$RELEASES" > /dev/null; then
            echo "::notice::SwiftlyS2 ${TARGET} has no ${ZIP} yet; the next run picks it up"
            exit 0
          fi
          if ! curl -fsSL --retry 3 https://api.nuget.org/v3-flatcontainer/swiftlys2.cs2/index.json \
            | jq -e --arg v "$NUGET_VERSION" '.versions | index($v)' > /dev/null; then
            echo "::notice::SwiftlyS2.CS2 ${NUGET_VERSION} is not on NuGet yet; the next run picks it up"
            exit 0
          fi

          sed -i "s|SWIFTLYS2_VERSION=\"[^\"]*\"|SWIFTLYS2_VERSION=\"${TARGET}\"|" apps/swiftly/Dockerfile
          grep -q "SWIFTLYS2_VERSION=\"${TARGET}\"" apps/swiftly/Dockerfile \
            || { echo "::error::could not set SWIFTLYS2_VERSION in apps/swiftly/Dockerfile"; exit 1; }

          # The runtime zip and EVERY plugin's nuget must move together. The
          # csproj list is discovered rather than written down: when the
          # practice plugin arrived with its own pin, a hand-written list left
          # it a version behind the runtime it gets loaded into.
          mapfile -t CSPROJS < <(grep -rl 'Include="SwiftlyS2.CS2"' --include='*.csproj' apps || true)
          if [ ${#CSPROJS[@]} -eq 0 ]; then
            echo "::error::no csproj references SwiftlyS2.CS2 -- the pin pattern must have changed"
            exit 1
          fi
          for csproj in "${CSPROJS[@]}"; do
            sed -i "s|<PackageReference Include=\"SwiftlyS2.CS2\" Version=\"[^\"]*\"|<PackageReference Include=\"SwiftlyS2.CS2\" Version=\"${NUGET_VERSION}\"|" "$csproj"
            grep -q "Include=\"SwiftlyS2.CS2\" Version=\"${NUGET_VERSION}\"" "$csproj" \
              || { echo "::error::could not pin SwiftlyS2.CS2 to ${NUGET_VERSION} in ${csproj}"; exit 1; }
          done

          git add apps/swiftly/Dockerfile "${CSPROJS[@]}"
          echo sw >> "$RUNNER_TEMP/images"
          echo "SwiftlyS2 to ${TARGET}" >> "$RUNNER_TEMP/bumps"

      - name: CounterStrikeSharp
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git checkout -- .
          CURRENT_URL=$(grep -oP 'ENV COUNTER_STRIKE_SHARP_URL=\K\S+' apps/counterstrikesharp/Dockerfile)
          LATEST_URL=$(gh api repos/roflmuffin/CounterStrikeSharp/releases/latest \
            --jq '[.assets[] | select(.name | contains("linux") and contains("runtime")) | .browser_download_url] | first // ""')
          echo "current=$CURRENT_URL latest=$LATEST_URL"

          if [ -z "$LATEST_URL" ]; then
            echo "::error::no linux runtime asset in the latest CounterStrikeSharp release"
            exit 1
          fi
          if [ "$CURRENT_URL" = "$LATEST_URL" ]; then
            exit 0
          fi
          if [[ ! "$LATEST_URL" =~ ^https://github\.com/roflmuffin/CounterStrikeSharp/releases/download/v[0-9.]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unexpected CounterStrikeSharp asset URL: $LATEST_URL"
            exit 1
          fi
          VERSION_NUMBER=$(echo "$LATEST_URL" | grep -oP 'v\K\d+\.\d+\.\d+' | head -1)

          sed -i "s|ENV COUNTER_STRIKE_SHARP_URL=.*|ENV COUNTER_STRIKE_SHARP_URL=${LATEST_URL}|" apps/counterstrikesharp/Dockerfile
          grep -qF "ENV COUNTER_STRIKE_SHARP_URL=${LATEST_URL}" apps/counterstrikesharp/Dockerfile \
            || { echo "::error::could not set COUNTER_STRIKE_SHARP_URL in apps/counterstrikesharp/Dockerfile"; exit 1; }

          mapfile -t CSPROJS < <(grep -rl 'Include="CounterStrikeSharp.API"' --include='*.csproj' apps || true)
          if [ ${#CSPROJS[@]} -eq 0 ]; then
            echo "::error::no csproj references CounterStrikeSharp.API -- the pin pattern must have changed"
            exit 1
          fi
          for csproj in "${CSPROJS[@]}"; do
            sed -i "s|<PackageReference Include=\"CounterStrikeSharp.API\" Version=\"[^\"]*\"|<PackageReference Include=\"CounterStrikeSharp.API\" Version=\"${VERSION_NUMBER}\"|" "$csproj"
            grep -q "Include=\"CounterStrikeSharp.API\" Version=\"${VERSION_NUMBER}\"" "$csproj" \
              || { echo "::error::could not pin CounterStrikeSharp.API to ${VERSION_NUMBER} in ${csproj}"; exit 1; }
          done

          git add apps/counterstrikesharp/Dockerfile "${CSPROJS[@]}"
          # the validator bakes CCS_GAMEDATA_REF from this Dockerfile's URL
          printf 'css\nvalidator\n' >> "$RUNNER_TEMP/images"
          echo "CounterStrikeSharp to v${VERSION_NUMBER}" >> "$RUNNER_TEMP/bumps"

      - name: Metamod
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git checkout -- .
          CURRENT_URL=$(grep -oP 'ENV METAMOD_URL=\K\S+' apps/counterstrikesharp/Dockerfile)
          # not every release ships a linux tarball, so take the newest one that does
          LATEST_URL=$(gh api "repos/alliedmodders/metamod-source/releases?per_page=20" \
            --jq '[.[] | select(.tag_name | startswith("2.")) | .assets[] | select(.name | test("^mmsource-.*-linux\\.tar\\.gz$")) | .browser_download_url] | first // ""')
          echo "current=$CURRENT_URL latest=$LATEST_URL"

          if [ -z "$LATEST_URL" ]; then
            echo "::error::no linux release asset found for metamod-source 2.x"
            exit 1
          fi
          if [ "$CURRENT_URL" = "$LATEST_URL" ]; then
            exit 0
          fi
          if [[ ! "$LATEST_URL" =~ ^https://github\.com/alliedmodders/metamod-source/releases/download/[0-9.]+/mmsource-[A-Za-z0-9.-]+-linux\.tar\.gz$ ]]; then
            echo "::error::unexpected metamod asset URL: $LATEST_URL"
            exit 1
          fi
          BUILD_ID=$(echo "$LATEST_URL" | grep -oP '(?<=mmsource-)[^/]+(?=-linux)')

          sed -i "s|ENV METAMOD_URL=.*|ENV METAMOD_URL=${LATEST_URL}|" apps/counterstrikesharp/Dockerfile
          grep -qF "ENV METAMOD_URL=${LATEST_URL}" apps/counterstrikesharp/Dockerfile \
            || { echo "::error::could not set METAMOD_URL in apps/counterstrikesharp/Dockerfile"; exit 1; }

          git add apps/counterstrikesharp/Dockerfile
          printf 'css\nvalidator\n' >> "$RUNNER_TEMP/images"
          echo "Metamod to ${BUILD_ID}" >> "$RUNNER_TEMP/bumps"

      - name: AddonsManager
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git checkout -- .
          CURRENT=$(grep -oP 'ADDONS_MANAGER_VERSION="\K[^"]+' apps/swiftly/Dockerfile)
          RELEASE=$(gh api repos/SwiftlyS2-Plugins/AddonsManager/releases/latest)
          LATEST=$(jq -r .tag_name <<<"$RELEASE")
          echo "current=$CURRENT latest=$LATEST"

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ] || [ "$CURRENT" = "$LATEST" ]; then
            exit 0
          fi
          # a rebuild of a release is tagged v2.1.0-2
          if [[ ! "$LATEST" =~ ^v[0-9]+(\.[0-9]+)+(-[0-9]+)?$ ]]; then
            echo "::error::unexpected AddonsManager tag: $LATEST"
            exit 1
          fi

          # The download URL is built from the tag and the asset name, and the
          # asset has been renamed before (AddonsManager.zip became
          # AddonsManager-v2.0.4.zip) and a rebuild keeps the zip name of the
          # version it rebuilds (v2.1.0-2 ships AddonsManager-v2.1.0.zip), so
          # the name is read off the release or the image's download 404s.
          ASSET=""
          for name in "AddonsManager-${LATEST}.zip" "AddonsManager-${LATEST%-*}.zip"; do
            if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<<"$RELEASE" > /dev/null; then
              ASSET="$name"
              break
            fi
          done
          if [ -z "$ASSET" ]; then
            echo "::error::AddonsManager ${LATEST} ships no AddonsManager-${LATEST}.zip ($(jq -r '[.assets[].name] | join(", ")' <<<"$RELEASE")); update ADDONS_MANAGER_ASSET in apps/swiftly/Dockerfile by hand"
            exit 1
          fi

          sed -i "s|ADDONS_MANAGER_VERSION=\"[^\"]*\"|ADDONS_MANAGER_VERSION=\"${LATEST}\"|" apps/swiftly/Dockerfile
          sed -i "s|ADDONS_MANAGER_ASSET=\"[^\"]*\"|ADDONS_MANAGER_ASSET=\"${ASSET}\"|" apps/swiftly/Dockerfile
          if ! grep -q "ADDONS_MANAGER_VERSION=\"${LATEST}\"" apps/swiftly/Dockerfile \
            || ! grep -q "ADDONS_MANAGER_ASSET=\"${ASSET}\"" apps/swiftly/Dockerfile; then
            echo "::error::could not set ADDONS_MANAGER_VERSION/ADDONS_MANAGER_ASSET in apps/swiftly/Dockerfile"
            exit 1
          fi

          git add apps/swiftly/Dockerfile
          echo sw >> "$RUNNER_TEMP/images"
          echo "AddonsManager to ${LATEST}" >> "$RUNNER_TEMP/bumps"

      - name: Commit and rebuild
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git checkout -- .
          if [ ! -s "$RUNNER_TEMP/bumps" ]; then
            echo "everything is current"
            exit 0
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "chore: update $(paste -sd ';' "$RUNNER_TEMP/bumps" | sed 's/;/, /g')"
          git pull --rebase --quiet
          git push

          # A push made with GITHUB_TOKEN starts no workflows, so CI never sees
          # this commit on its own and the image keeps the old version until
          # something unrelated lands. workflow_dispatch is the one event that
          # token is allowed to start.
          IMAGES=$(sort -u "$RUNNER_TEMP/images" | paste -sd, -)
          gh workflow run ci.yaml --ref "$GITHUB_REF_NAME" -f only="$IMAGES"
          echo "dispatched CI for $IMAGES"
