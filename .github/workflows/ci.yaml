name: CI

on:
  push:
    branches:
      - "main"
      - "beta"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated images to build (css, sw, validator, simulator); blank builds all"
        type: string
        default: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # every build cuts a release that nodes auto-update to, so a dispatch that
    # names its images must not ship the others as no-op versions
    outputs:
      css: ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == '' || contains(inputs.only, 'css'))) || steps.filter.outputs.css == 'true' }}
      sw: ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == '' || contains(inputs.only, 'sw'))) || steps.filter.outputs.sw == 'true' }}
      validator: ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == '' || contains(inputs.only, 'validator'))) || steps.filter.outputs.validator == 'true' }}
      simulator: ${{ (github.event_name == 'workflow_dispatch' && (inputs.only == '' || contains(inputs.only, 'simulator'))) || steps.filter.outputs.simulator == 'true' }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      # the channel IS the published tag, and workflow_dispatch runs from any branch,
      # so refuse rather than default an unreviewed ref onto :latest
      - id: channel
        run: |
          case "$GITHUB_REF_NAME" in
            main) echo "channel=latest" >> "$GITHUB_OUTPUT" ;;
            beta) echo "channel=beta" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::refusing to publish from '$GITHUB_REF_NAME'; run this workflow from main or beta"
              exit 1
              ;;
          esac

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # naming the pushed branch is what makes this diff against the commit before
          # the push; unset it defaults to the repo's default branch
          base: ${{ github.ref_name }}
          filters: |
            shared: &shared
              - 'shared/**'
              - 'Directory.Build.props'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/plugin-build.yaml'
            # each game-server image builds its match plugin and the player
            # management plugin, and the SwiftlyS2 one the practice plugin as
            # well, so any of those source trees rebuilds it
            css:
              - *shared
              - 'apps/counterstrikesharp/**'
              - 'apps/player-management-css/**'
            sw:
              - *shared
              - 'apps/swiftly/**'
              - 'apps/utility-sw/**'
              - 'apps/player-management-sw/**'
            validator:
              - 'apps/gamedata-validator/**'
              - 'shared/gamedata/**'
              - '.github/workflows/validator-build.yaml'
              # CCS_GAMEDATA_REF is baked from this Dockerfile's CounterStrikeSharp URL
              - 'apps/counterstrikesharp/Dockerfile'
            simulator:
              - 'apps/simulator/**'
              - 'shared/dotnet/FiveStack.Entities/**'
              - 'shared/dotnet/FiveStack.Enums/**'
              - 'Directory.Build.props'
              - '.github/workflows/simulator-build.yaml'

  counterstrikesharp:
    needs: changes
    if: needs.changes.outputs.css == 'true'
    uses: ./.github/workflows/plugin-build.yaml
    with:
      app_dir: apps/counterstrikesharp
      image: game-server-css
      tag_prefix: css
      # legacy releases are bare v0.0.N; matching them keeps the counter from resetting
      version_tag_regex: '^(?:css-)?v0\.0\.(\d+)$'
      channel: ${{ needs.changes.outputs.channel }}
      run_tests: true
    secrets: inherit

  swiftly:
    needs: changes
    if: needs.changes.outputs.sw == 'true'
    uses: ./.github/workflows/plugin-build.yaml
    with:
      app_dir: apps/swiftly
      image: game-server-sw
      tag_prefix: sw
      version_tag_regex: '^sw-v0\.0\.(\d+)$'
      # swiftly's releases were cut in the old repo up to v0.0.41 and did not travel
      version_floor: 41
      channel: ${{ needs.changes.outputs.channel }}
      run_tests: true
      # the player management suite covers the shared code both runtimes build
      extra_test_dirs: apps/utility-sw apps/player-management-sw
    secrets: inherit

  # The practice plugin ships in the SwiftlyS2 image, and the layouts it draws
  # reach players from the Workshop. Published in the run that releases the
  # image, on either channel, so a server never runs a plugin whose HUD is not
  # there to be downloaded. Beside the build rather than after it: the files
  # should be on the Workshop before the first server has pulled the image, and
  # one that never ships costs nothing -- a published name is never reused.
  practice-hud:
    needs: changes
    if: needs.changes.outputs.sw == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/hud-workshop.yaml
    secrets: inherit

  gamedata-validator:
    needs: changes
    if: needs.changes.outputs.validator == 'true'
    uses: ./.github/workflows/validator-build.yaml
    with:
      channel: ${{ needs.changes.outputs.channel }}
    secrets: inherit

  simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    uses: ./.github/workflows/simulator-build.yaml
    with:
      channel: ${{ needs.changes.outputs.channel }}
    secrets: inherit
